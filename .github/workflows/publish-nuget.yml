name: Publish NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required so this job can request a GitHub OIDC token for NuGet Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      # restore deps
      - name: Restore dependencies
        run: dotnet restore Mango/Mango.csproj

      # build
      - name: Build project
        run: dotnet build Mango/Mango.csproj -c Release --no-restore -p:Version=${{ env.VERSION }}

      # pack
      - name: Pack library
        run: |
          rm -rf Mango/artifacts
          dotnet pack Mango/Mango.csproj -c Release --no-build -p:Version=${{ env.VERSION }} -o Mango/artifacts

      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      # publish
      - name: Publish to NuGet.org
        run: dotnet nuget push Mango/artifacts/*.nupkg --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
